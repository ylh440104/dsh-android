name: Build and Verify
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  verify-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no comments in Kotlin sources
        run: |
          fail=0
          while IFS= read -r file; do
            if grep -qE '^\s*//|/\*|\*/' "$file"; then
              echo "comment found in $file"
              fail=1
            fi
          done < <(find app/src/main/java -name '*.kt')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "no comments found"
      - name: Assert protocol constants present
        run: |
          F=app/src/main/java/com/deepseek/harness/api/PlatformClient.kt
          grep -q 'auth-api/v0/dsh/auth_init' $F
          grep -q 'auth-api/v0/dsh/auth_exchange' $F
          grep -q 'api/v0/users/get_user_summary' $F
          grep -q 'auth-api/v0/users/current' $F
          echo "platform endpoints present"
          I=app/src/main/java/com/deepseek/harness/api/InferenceClient.kt
          grep -q 'anthropic/v1/messages' $I
          grep -q 'x-dsh-auth-token' $I
          grep -q 'anthropic-version' $I
          echo "inference endpoints present"
      - name: Assert PKCE implemented
        run: |
          F=app/src/main/java/com/deepseek/harness/auth/Pkce.kt
          grep -q 'SHA-256' $F
          grep -q 'URL_SAFE' $F
          echo "pkce present"
      - name: Assert no bundled runtime leftovers
        run: |
          if [ -d tools ]; then echo "tools dir should be gone"; exit 1; fi
          if [ -f app/src/main/java/com/deepseek/harness/NodeLauncher.java ]; then echo "NodeLauncher should be gone"; exit 1; fi
          if grep -rq 'xz' app/build.gradle; then echo "xz dependency should be gone"; exit 1; fi
          echo "runtime leftovers absent"

  release:
    needs: [build-apk, verify-protocol]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-apk
          path: ./apk
      - name: Delete existing release
        run: gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: apk/*.apk
          draft: false
          prerelease: true