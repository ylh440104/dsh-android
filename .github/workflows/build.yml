name: Build and Verify
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Android SDK
        run: |
          export ANDROID_HOME=$HOME/android-sdk
          mkdir -p $ANDROID_HOME/cmdline-tools
          cd $ANDROID_HOME/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O cmdline-tools.zip
          unzip -q cmdline-tools.zip
          mv cmdline-tools latest
          rm cmdline-tools.zip
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> $GITHUB_ENV
          echo "$ANDROID_HOME/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "$ANDROID_HOME/platform-tools" >> $GITHUB_PATH
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'
      - name: Build APK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          gradle assembleDebug --no-daemon --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 30

  verify-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check no comments in Kotlin sources
        run: |
          fail=0
          while IFS= read -r file; do
            if grep -qE '^[[:space:]]*//|^[[:space:]]*/\*|\*/[[:space:]]*$' "$file"; then
              echo "comment found in $file"
              grep -nE '^[[:space:]]*//|^[[:space:]]*/\*|\*/[[:space:]]*$' "$file"
              fail=1
            fi
          done < <(find app/src/main/java -name '*.kt')
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "no comments found"
      - name: Assert protocol constants present
        run: |
          F=app/src/main/java/com/deepseek/harness/api/PlatformClient.kt
          grep -q 'auth-api/v0/dsh/auth_init' $F
          grep -q 'auth-api/v0/dsh/auth_exchange' $F
          grep -q 'api/v0/users/get_user_summary' $F
          grep -q 'auth-api/v0/users/current' $F
          echo "platform endpoints present"
          I=app/src/main/java/com/deepseek/harness/api/InferenceClient.kt
          grep -q 'anthropic/v1/messages' $I
          grep -q 'x-dsh-auth-token' $I
          grep -q 'anthropic-version' $I
          echo "inference endpoints present"
      - name: Assert PKCE implemented
        run: |
          F=app/src/main/java/com/deepseek/harness/auth/Pkce.kt
          grep -q 'SHA-256' $F
          grep -q 'URL_SAFE' $F
          echo "pkce present"
      - name: Assert tool surface present
        run: |
          F=app/src/main/java/com/deepseek/harness/tools/ToolRegistry.kt
          for t in list_files read_file read_file_part create_file edit_file write_file delete_file make_directory find_files file_exists file_info copy_file move_file grep_code grep_context zip_files unzip_files list_zip http_request device_info current_time list_apps app_info start_app stop_app open_url open_file get_system_setting shell; do
            grep -q "\"$t\"" $F || (echo "missing tool $t" && exit 1)
          done
          echo "tool surface present"
      - name: Assert markdown renderer present
        run: |
          test -f app/src/main/java/com/deepseek/harness/ui/md/MarkdownParser.kt || (echo "markdown parser missing" && exit 1)
          test -f app/src/main/java/com/deepseek/harness/ui/md/MarkdownText.kt || (echo "markdown renderer missing" && exit 1)
          grep -q 'MdBlock.Code' app/src/main/java/com/deepseek/harness/ui/md/MarkdownText.kt
          grep -q 'LocalClipboardManager' app/src/main/java/com/deepseek/harness/ui/MessageBubble.kt
          grep -q 'MarkdownText' app/src/main/java/com/deepseek/harness/ui/MessageBubble.kt
          echo "markdown and copy present"
      - name: Assert shizuku integration present
        run: |
          F=app/src/main/java/com/deepseek/harness/shell/ShizukuManager.kt
          grep -q 'IShizukuService' $F
          grep -q 'requestPermission' $F
          grep -q 'checkSelfPermission' $F
          M=app/src/main/AndroidManifest.xml
          grep -q 'rikka.shizuku.ShizukuProvider' $M
          grep -q 'MANAGE_EXTERNAL_STORAGE' $M
          grep -q 'shizuku:aidl' app/build.gradle
          echo "shizuku integration present"
      - name: Assert path sandbox rules present
        run: |
          F=app/src/main/java/com/deepseek/harness/tools/PathGuard.kt
          grep -q 'SANDBOX_ROOT' $F
          grep -q 'isProtected' $F
          grep -q 'normalize' $F
          echo "path rules present"
      - name: Assert no bundled runtime leftovers
        run: |
          if [ -d tools ]; then echo "tools dir should be gone"; exit 1; fi
          if [ -f app/src/main/java/com/deepseek/harness/NodeLauncher.java ]; then echo "NodeLauncher should be gone"; exit 1; fi
          if grep -rq 'xz' app/build.gradle; then echo "xz dependency should be gone"; exit 1; fi
          echo "runtime leftovers absent"

  release:
    needs: [build-apk, verify-protocol]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dsh-apk
          path: ./apk
      - name: Delete existing release
        run: gh release delete ${{ github.ref_name }} --yes --cleanup-tag || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: apk/*.apk
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') }}